<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Web App - Sample UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <div class="logo">MyJavaApp</div>
  <nav>Dashboard | Profile | Settings</nav>
</header>
<div class="container">
  <h2>Welcome to Web Application</h2>
  <p>This is a responsive JSP-style template built with HTML5, CSS3 and Vanilla JS.</p>
  <div class="card">
    <h3>User Details</h3>
    <input type="text" id="username" placeholder="Enter username">
    <button onclick="showGreeting()">Submit</button>
    <p id="greet"></p>
  </div>
</div>
<footer>© 2026 MyJavaApp - Responsive & Pixel Perfect</footer>
<script src="script.js"></script>
</body>
</html>
